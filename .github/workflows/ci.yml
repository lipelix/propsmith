name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # Builds every asset from source in Blender, so what is published never depends on files a contributor built:
  # the committed measurements must be what this build measures. A pull request runs here with no secrets.
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: blender
        run: echo "version=$(cat .blender-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: ~/blender
          key: blender-${{ steps.blender.outputs.version }}-linux-x64
      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          version="${{ steps.blender.outputs.version }}"
          curl -fsSL "https://download.blender.org/release/Blender${version%.*}/blender-${version}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          mkdir -p ~/blender
          tar -xJf /tmp/blender.tar.xz -C ~/blender --strip-components=1
      - name: Libraries for headless rendering
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6
      - run: echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/textures
          key: textures-${{ hashFiles('catalog/textures.json') }}
      - run: npm run textures
      - run: npm run build -- --force
      - name: The committed measurements and index are what this build produces
        run: git diff --exit-code -- catalog/measurements.json catalog/index.json
      - run: npm run bake
      - run: npm run site:data
      - run: npm run site:build
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: .cache/assets/*/review/*.png
          retention-days: 7

  # Publishes the site to Cloudflare Pages. Off until the repository variable DEPLOY is "true" (docs/deploy.md).
  deploy:
    needs: [check, assets]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://propsmith.pages.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - name: Required settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_BEACON_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing required setting: $name (docs/deploy.md)"; exit 1; fi
          done
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create propsmith --production-branch main || true
          npx --yes wrangler@4 pages deploy site/dist --project-name propsmith --branch main --commit-dirty=true
